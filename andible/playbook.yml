- hosts: jenkins
  become: yes
  become_user: root
  vars:
    kubeconfig_dest: /home/ubuntu/kubeconfig.yaml

  tasks:

    - name: Update system
      apt:
        update_cache: yes
        upgrade: yes
        autoremove: yes

    - name: Install base packages
      apt:
        name:
          - curl
          - unzip
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Install Java 21
      apt:
        name: openjdk-21-jre
        state: present

    - name: Install Jenkins
      shell: |
        curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key \
        | tee /usr/share/keyrings/jenkins-keyring.asc > /dev/null

        echo deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] \
        https://pkg.jenkins.io/debian-stable binary/ \
        > /etc/apt/sources.list.d/jenkins.list

        DEBIAN_FRONTEND=noninteractive apt update -y
        DEBIAN_FRONTEND=noninteractive apt install -y jenkins
      args:
        executable: /bin/bash

    - name: Enable and start Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started

    - name: Install kubectl
      shell: |
        curl -LO https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl
        install kubectl /usr/local/bin/
      args:
        executable: /bin/bash

    - name: Install Minikube
      shell: |
        curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        install minikube-linux-amd64 /usr/local/bin/minikube
      args:
        executable: /bin/bash

    - name: Print initial Jenkins admin password
      shell: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password

    - name: Show Jenkins admin password
      debug:
        msg: "Jenkins initial admin password is: {{ jenkins_password.stdout }}"

    - name: Start Minikube with 2GB memory (non-interactive)
      shell: minikube start --memory=2048 --driver=docker
      args:
        executable: /bin/bash

    - name: Add Jenkins user to Docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Update Jenkins Java args for stability
      lineinfile:
        path: /etc/default/jenkins
        line: 'JAVA_ARGS="-Djenkins.install.runSetupWizard=false -Xms512m -Xmx2048m"'
        create: yes

    - name: Restart Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: restarted

    - name: Set kubectl context to minikube
      shell: kubectl config use-context minikube
      args:
        executable: /bin/bash

    - name: Ensure Minikube nodes are up
      shell: kubectl get nodes
      args:
        executable: /bin/bash

    - name: Create namespace task-management
      shell: kubectl create namespace task-management
      ignore_errors: yes
      args:
        executable: /bin/bash

    - name: Save kubeconfig to file
      shell: kubectl config view --raw --flatten > {{ kubeconfig_dest }}
      args:
        creates: "{{ kubeconfig_dest }}"
        executable: /bin/bash

    - name: Download kubeconfig.yaml to local machine
      fetch:
        src: "{{ kubeconfig_dest }}"
        dest: "./kubeconfig.yaml"
        flat: yes
