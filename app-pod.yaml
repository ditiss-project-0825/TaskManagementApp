apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-app
  template:
    metadata:
      labels:
        app: task-app
    spec:
      containers:
      - name: backend
        image: be:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082

      - name: frontend
        image: fe:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
